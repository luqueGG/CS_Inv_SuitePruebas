[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-pilot"
version = "0.1.0"
description = "Pilot: Assertion Roulette feedback vs generic feedback for LLM-generated pytest tests, with mutmut mutation score."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mutmut>=3.0"]

[project.scripts]
ar-pilot = "ar_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"